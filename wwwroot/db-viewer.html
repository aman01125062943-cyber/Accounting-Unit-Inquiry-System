<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مستعرض قاعدة البيانات الكاملة - C# .NET 8</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b1120;
      --sidebar-bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* الشريط الجانبي Sidebar */
    .sidebar { width: 260px; background: var(--sidebar-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; shrink: 0; }
    .sidebar-header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .sidebar-header h2 { font-size: 1.2rem; color: #38bdf8; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .sidebar-header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    
    .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .nav-item a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-weight: 700; transition: all 0.2s ease; }
    .nav-item a:hover, .nav-item a.active { background: var(--accent); color: #ffffff; }

    .main-content { flex: 1; padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

    .table-selector-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .table-selector-card label { font-size: 1rem; font-weight: 700; color: #38bdf8; }
    .table-selector-card select { flex: 1; min-width: 280px; padding: 10px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; overflow-x: auto; }
    .card h2 { font-size: 1.15rem; color: #ffffff; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .card h2 span { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; }

    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.85rem; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { background: #0f172a; color: #38bdf8; font-weight: 800; }
    tr:hover { background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>

  <!-- الشريط الجانبي Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2><i class="fa-solid fa-server"></i> منظومة HK C#</h2>
      <p>تطبيق C# .NET 8 المستقل</p>
    </div>
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="/archive-inquiry.html">
          <i class="fa-solid fa-magnifying-glass"></i>
          استعلام البيانات الأرشيفية
        </a>
      </li>
      <li class="nav-item">
        <a href="/db-viewer.html" class="active">
          <i class="fa-solid fa-database"></i>
          جدول قاعدة البيانات كاملة
        </a>
      </li>
      <li class="nav-item">
        <a href="/">
          <i class="fa-solid fa-gauge-high"></i>
          لوحة التحكم الرئيسية
        </a>
      </li>
    </ul>
  </aside>

  <!-- الصفحة الرئيسية -->
  <main class="main-content">
    <div class="table-selector-card">
      <label><i class="fa-solid fa-table-list"></i> اختر الجدول للتقصي والتحكم ببيانات C# SQLite:</label>
      <select id="table-select" onchange="jumpToTable(this.value)">
        <option value="ALL">-- جاري جلب قائمة الجداول --</option>
      </select>
    </div>

    <div id="tables-container">
      <div style="text-align: center; padding: 50px; color: #94a3b8;">
        جاري استخراج جداول قاعدة بيانات C#... ⏳
      </div>
    </div>
  </main>

  <script>
    let allTablesData = {};

    async function loadTables() {
      try {
        const res = await fetch('/api/connector/all-tables');
        const result = await res.json();
        if (result.success) {
          allTablesData = result.tables;
          populateSelect(Object.keys(allTablesData));
          renderAllTables(allTablesData);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function populateSelect(tableNames) {
      const select = document.getElementById('table-select');
      select.innerHTML = '<option value="ALL">-- عرض كافة جداول قاعدة البيانات (' + tableNames.length + ' جدول) --</option>';
      tableNames.forEach(name => {
        const count = Array.isArray(allTablesData[name]) ? allTablesData[name].length : 0;
        select.innerHTML += `<option value="${name}">جدول: ${name} (${count} سجل)</option>`;
      });
    }

    function renderAllTables(tablesObj) {
      const container = document.getElementById('tables-container');
      container.innerHTML = '';

      const keys = Object.keys(tablesObj);
      if (keys.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">لا توجد جداول متاحة</div>';
        return;
      }

      keys.forEach((tableName, idx) => {
        const rows = tablesObj[tableName] || [];
        const card = document.createElement('div');
        card.className = 'card';

        let headersHTML = '';
        let bodyHTML = '';

        if (rows.length > 0) {
          const cols = Object.keys(rows[0]);
          headersHTML = cols.map(c => `<th>${c}</th>`).join('');
          bodyHTML = rows.map(r => {
            const cells = cols.map(c => {
              const val = r[c] !== null && r[c] !== undefined ? String(r[c]) : '-';
              return `<td title="${val.replace(/"/g, '&quot;')}">${val}</td>`;
            }).join('');
            return `<tr>${cells}</tr>`;
          }).join('');
        } else {
          headersHTML = '<th>الحالة</th>';
          bodyHTML = '<tr><td>جدول فارغ</td></tr>';
        }

        card.innerHTML = `
          <h2>
            <span>${idx + 1}. جدول: <strong style="color:var(--accent);">${tableName}</strong></span>
            <span>عدد السجلات: <strong>${rows.length}</strong></span>
          </h2>
          <table>
            <thead><tr>${headersHTML}</tr></thead>
            <tbody>${bodyHTML}</tbody>
          </table>
        `;
        container.appendChild(card);
      });
    }

    function jumpToTable(tableName) {
      if (tableName === 'ALL') {
        renderAllTables(allTablesData);
      } else {
        const singleObj = {};
        singleObj[tableName] = allTablesData[tableName];
        renderAllTables(singleObj);
      }
    }

    loadTables();
  </script>
</body>
</html>
