version: "2"
type: frontend
tech_stack:
  - HTML5
  - Vanilla CSS
  - JavaScript
  - ASP.NET Core (Backend)
  - Dapper (ORM)
  - SQLite (Database)
  - XLSX.js (Excel Library)
routes:
  - path: /#dashboard
    file: wwwroot/index.html
    auth_required: true
    description: Main dashboard showing financial statistics and summaries.
  - path: /#search
    file: wwwroot/index.html
    auth_required: true
    description: Global search interface for all return types.
  - path: /#returns
    file: wwwroot/index.html
    auth_required: true
    description: Incentive returns management (List, Add, Sync).
  - path: /#salaries
    file: wwwroot/index.html
    auth_required: true
    description: Salary returns management (List, Add, Sync).
  - path: /#archive
    file: wwwroot/index.html
    auth_required: true
    description: History of archived returns with restore capabilities.
  - path: /#settings
    file: wwwroot/index.html
    auth_required: true
    description: Application configuration, user management, and database tools.
features:
  - name: Incentive Returns Management
    description: Comprehensive system for managing incentive returns.
    files:
      - wwwroot/index.html
      - wwwroot/js/app.js
      - Endpoints/ReturnsEndpoints.cs
    entry_route: /#returns
    user_interactions:
      - Upload Excel files
      - Sync with local attachments
      - Edit record details
      - Delete records with password protection
    api_calls:
      - method: GET
        endpoint: /returns
      - method: POST
        endpoint: /returns/upload
  - name: Salary Returns Management
    description: Specialized system for salary return records.
    files:
      - wwwroot/index.html
      - wwwroot/js/app.js
      - Endpoints/SalaryReturnsEndpoints.cs
    entry_route: /#salaries
    user_interactions:
      - Upload salary data
      - Match attachments via NID/Name
      - Generate payment reports
    api_calls:
      - method: GET
        endpoint: /salary-returns
  - name: Archive System
    description: Soft delete and history management for returns.
    files:
      - wwwroot/index.html
      - wwwroot/js/app.js
      - Endpoints/ArchiveEndpoints.cs
    entry_route: /#archive
    user_interactions:
      - View archived versions
      - Restore specific archive points
      - Delete permanent history
    api_calls:
      - method: GET
        endpoint: /archive
  - name: Professional Reporting
    description: Generation of formatted financial reports for printing.
    files:
      - wwwroot/index.html
      - wwwroot/js/app.js
    entry_route: /#search
    user_interactions:
      - Search for beneficiary
      - Select report options
      - Review and print professional financial statement
known_limitations:
  - issue: Offline mode depends on previously loaded assets
    location: wwwroot/index.html
    impact: Requires localization of all assets for 100% air-gapped use.
